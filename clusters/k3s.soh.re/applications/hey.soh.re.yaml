apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: hey-soh-re
  namespace: argocd
spec:
  project: default
  source:
    chart: jmainguy/helm-webapp
    repoURL: zot.soh.re
    targetRevision: 4.2.4
    helm:
      values: |
        name: hey-soh-re
        replicaCount: 2
        service:
          type: ClusterIP
          port: 80
          targetPort: 8080
          name: hey-soh-re
        virtualService:
          hosts:
            - "hey.soh.re"
        image:
          repository: zot.soh.re
          name: jmainguy/hey.soh.re
          tag: "v2.0.1"
          pullPolicy: IfNotPresent

  destination:
    name: k3s.soh.re
    namespace: hey-soh-re
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true
    - ServerSideApply=true
