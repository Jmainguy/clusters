apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: zot
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/jmainguy/helm-charts
    targetRevision: main
    path: zot
    helm:
      releaseName: zot-ha
  destination:
    name: k3s.soh.re
    namespace: zot
  ignoreDifferences:
  - group: apps
    kind: StatefulSet
    name: zot-local-primary
    jqPathExpressions:
    - .spec.volumeClaimTemplates[]?.apiVersion
    - .spec.volumeClaimTemplates[]?.kind
    - .spec.volumeClaimTemplates[]?.spec.volumeMode
    - .spec.volumeClaimTemplates[]?.status
  - group: apps
    kind: StatefulSet
    name: zot-local-standby
    jqPathExpressions:
    - .spec.volumeClaimTemplates[]?.apiVersion
    - .spec.volumeClaimTemplates[]?.kind
    - .spec.volumeClaimTemplates[]?.spec.volumeMode
    - .spec.volumeClaimTemplates[]?.status
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true
    - ServerSideApply=true
