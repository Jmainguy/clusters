apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: garage
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/jmainguy/helm-charts
    targetRevision: main
    path: garage
    helm:
      releaseName: garage
  destination:
    name: k3s.soh.re
    namespace: garage
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
